<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System (Qwen 3.8 Q4)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; cursor: grab; }
canvas:active { cursor: grabbing; }
#ui {
position: fixed; top: 16px; left: 16px; color: #fff; z-index: 10;
background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.15);
border-radius: 12px; padding: 16px 20px; min-width: 220px;
backdrop-filter: blur(8px);
}
#ui h2 { font-size: 15px; margin-bottom: 10px; color: #f0d060; font-weight: 600; }
#ui .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 12px; color: #aab; }
#ui .row label { margin-right: 8px; }
#ui input[type=range] { width: 100px; accent-color: #f0d060; }
#ui button {
background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
color: #dde; padding: 5px 12px; border-radius: 6px; cursor: pointer;
font-size: 11px; margin-top: 8px;
}
#ui button:hover { background: rgba(255,255,255,0.2); }
#info {
position: fixed; bottom: 16px; left: 16px; color: #889; font-size: 11px;
background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px;
border: 1px solid rgba(255,255,255,0.1);
}
#tooltip {
position: fixed; pointer-events: none; color: #fff; font-size: 13px;
background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 6px;
border: 1px solid rgba(255,255,255,0.2); display: none; z-index: 20;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<h2>☀️ Solar System</h2>
<div class="row"><label>Speed</label><input type="range" id="speed" min="0" max="100" value="30"></div>
<div class="row"><label>Zoom</label><input type="range" id="zoom" min="20" max="200" value="80"></div>
<div class="row"><label>Orbits</label><input type="checkbox" id="showOrbits" checked></div>
<div class="row"><label>Labels</label><input type="checkbox" id="showLabels" checked></div>
<button id="resetBtn">Reset View</button>
</div>
<div id="info">Drag to rotate · Scroll to zoom · Hover for info</div>
<div id="tooltip"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// Camera
let camX = 0, camY = 0;
let camDist = 800;
let speedFactor = 0.3;
let showOrbits = true;
let showLabels = true;

// Stars
const stars = [];
for (let i = 0; i < 800; i++) {
    stars.push({
        x: Math.random() * 2 - 1,
        y: Math.random() * 2 - 1,
        z: Math.random() * 2 - 1,
        brightness: Math.random() * 0.7 + 0.3,
        size: Math.random() * 1.5 + 0.5
    });
}

// Celestial body definitions
const bodies = [];

function addBody(name, type, color, radius, orbitRadius, orbitSpeed, parent, moonOrbitRadius, moonOrbitSpeed, extra) {
    bodies.push({
        name, type, color, radius,
        orbitRadius: orbitRadius || 0,
        orbitSpeed: orbitSpeed || 0,
        parent: parent || null,
        moonOrbitRadius: moonOrbitRadius || 0,
        moonOrbitSpeed: moonOrbitSpeed || 0,
        angle: Math.random() * Math.PI * 2,
        moonAngle: Math.random() * Math.PI * 2,
        extra: extra || {},
        pos: { x: 0, y: 0, z: 0 },
        screenPos: { x: 0, y: 0 },
        scale: 1,
        depth: 0,
        visible: true
    });
}

// Sun
addBody('Sun', 'star', '#FFD700', 35, 0, 0, null);

// Planets
addBody('Mercury', 'planet', '#B5B5B5', 4, 70, 4.15, null);
addBody('Venus', 'planet', '#E8CDA0', 7, 100, 1.62, null);
addBody('Earth', 'planet', '#4488CC', 7.5, 135, 1.0, null);
addBody('Mars', 'planet', '#CC6644', 5, 175, 0.53, null);
addBody('Jupiter', 'planet', '#D4A56A', 22, 250, 0.084, null);
addBody('Saturn', 'planet', '#E8D5A0', 18, 330, 0.034, null, null, null, { rings: true });
addBody('Uranus', 'planet', '#88CCCC', 13, 400, 0.012, null);
addBody('Neptune', 'planet', '#4466CC', 12, 460, 0.006, null);

// Moons
const earth = bodies[3];
addBody('Moon', 'moon', '#AAA', 2.5, 0, 0, earth, 14, 5.0);

const mars = bodies[4];
addBody('Phobos', 'moon', '#887766', 1.2, 0, 0, mars, 9, 8.0);
addBody('Deimos', 'moon', '#776655', 1, 0, 0, mars, 13, 4.0);

const jupiter = bodies[5];
addBody('Io', 'moon', '#CCBB44', 2.5, 0, 0, jupiter, 30, 4.0);
addBody('Europa', 'moon', '#AABBCC', 2.2, 0, 0, jupiter, 38, 2.8);
addBody('Ganymede', 'moon', '#998877', 3.5, 0, 0, jupiter, 48, 1.8);
addBody('Callisto', 'moon', '#776655', 3, 0, 0, jupiter, 60, 1.2);

const saturn = bodies[6];
addBody('Titan', 'moon', '#CC9944', 3, 0, 0, saturn, 35, 1.5);
addBody('Enceladus', 'moon', '#EEFFEE', 2, 0, 0, saturn, 25, 2.5);

const uranus = bodies[7];
addBody('Titania', 'moon', '#99AABB', 2.5, 0, 0, uranus, 22, 2.0);
addBody('Oberon', 'moon', '#8899AA', 2.3, 0, 0, uranus, 30, 1.4);

const neptune = bodies[8];
addBody('Triton', 'moon', '#AABBCC', 2.5, 0, 0, neptune, 20, -2.0);

// Orbital inclinations (slight tilt for visual interest)
const inclinations = [0, 0.02, 0, 0.03, 0.02, 0.04, 0.01, 0.03];
bodies.forEach((b, i) => {
    if (i > 0 && !b.parent) b.inclination = inclinations[i-1] || 0;
    if (b.parent) b.inclination = Math.random() * 0.1 - 0.05;
});

// 3D math
function rotateX(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
}
function rotateY(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
}
function rotateZ(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z };
}

function project(p) {
    // Apply camera rotation
    let r = rotateX(p, camX);
    r = rotateY(r, camY);
    // Translate for camera distance
    r.z += camDist;
    // Perspective projection
    const f = 600;
    if (r.z < 10) return { x: 0, y: 0, scale: 0, depth: r.z };
    const scale = f / r.z;
    return {
        x: W / 2 + r.x * scale,
        y: H / 2 + r.y * scale,
        scale: scale,
        depth: r.z
    };
}

// Drawing
function drawStar(s) {
    const p = { x: s.x * 3000, y: s.y * 3000, z: s.z * 3000 };
    let r = rotateX(p, camX * 0.3);
    r = rotateY(r, camY * 0.3);
    if (r.z > -1000) {
        const sx = W/2 + r.x * (600 / (r.z + 2500));
        const sy = H/2 + r.y * (600 / (r.z + 2500));
        if (sx > 0 && sx < W && sy > 0 && sy < H) {
            ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
            ctx.beginPath();
            ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawOrbit(cx, cy, cz, radius, inclination) {
    if (!showOrbits) return;
    const segments = 80;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        let px = cx + Math.cos(a) * radius;
        let py = cz * 0; // base plane
        let pz = cz + Math.sin(a) * radius;
        // Apply inclination
        if (inclination) {
            const ty = py * Math.cos(inclination) - pz * Math.sin(inclination);
            const tz = py * Math.sin(inclination) + pz * Math.cos(inclination);
            py = ty; pz = tz;
        }
        const p = project({ x: px, y: py, z: pz });
        if (p.scale > 0) {
            if (!started) { ctx.moveTo(p.x, p.y); started = true; }
            else ctx.lineTo(p.x, p.y);
        }
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawSun(b) {
    const p = project(b.pos);
    if (p.scale <= 0) return;
    const r = b.radius * p.scale;
    if (r < 1) return;

    // Glow
    const gradient = ctx.createRadialGradient(p.x, p.y, r * 0.3, p.x, p.y, r * 3);
    gradient.addColorStop(0, 'rgba(255, 220, 50, 0.8)');
    gradient.addColorStop(0.3, 'rgba(255, 150, 0, 0.3)');
    gradient.addColorStop(0.7, 'rgba(255, 100, 0, 0.1)');
    gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    const core = ctx.createRadialGradient(p.x - r*0.2, p.y - r*0.2, 0, p.x, p.y, r);
    core.addColorStop(0, '#FFFFEE');
    core.addColorStop(0.5, '#FFD700');
    core.addColorStop(1, '#FF8800');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlanet(b) {
    const p = project(b.pos);
    if (p.scale <= 0) return;
    const r = Math.max(b.radius * p.scale, 1.5);
    b.screenPos = { x: p.x, y: p.y };
    b.scale = r;
    b.depth = p.depth;

    // Shadow/lighting effect
    const lightAngle = Math.atan2(-p.x + W/2, -(p.y - H/2));
    const lx = Math.cos(lightAngle) * r * 0.3;
    const ly = Math.sin(lightAngle) * r * 0.3;

    const grad = ctx.createRadialGradient(p.x + lx, p.y + ly, r * 0.1, p.x, p.y, r);
    grad.addColorStop(0, lightenColor(b.color, 40));
    grad.addColorStop(0.7, b.color);
    grad.addColorStop(1, darkenColor(b.color, 60));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Saturn's rings
    if (b.extra.rings) {
        drawRings(p.x, p.y, r, b, p);
    }

    // Label
    if (showLabels && r > 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = `${Math.max(10, Math.min(13, r))}px Segoe UI`;
        ctx.textAlign = 'center';
        ctx.fillText(b.name, p.x, p.y - r - 6);
    }
}

function drawRings(x, y, r, b, p) {
    ctx.save();
    ctx.translate(x, y);
    const tilt = 0.3 + Math.sin(camX) * 0.2;
    ctx.scale(1, tilt);

    // Outer ring
    ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
    ctx.lineWidth = r * 0.4;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
    ctx.stroke();

    // Inner ring
    ctx.strokeStyle = 'rgba(180, 150, 110, 0.4)';
    ctx.lineWidth = r * 0.25;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
    ctx.stroke();

    // Gap (Cassini division)
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = r * 0.1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.62, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function drawMoon(b) {
    const p = project(b.pos);
    if (p.scale <= 0) return;
    const r = Math.max(b.radius * p.scale, 1);
    b.screenPos = { x: p.x, y: p.y };
    b.scale = r;
    b.depth = p.depth;

    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    if (showLabels && r > 2.5) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '9px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(b.name, p.x, p.y - r - 4);
    }
}

function lightenColor(hex, amt) {
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    r = Math.min(255, r + amt);
    g = Math.min(255, g + amt);
    b = Math.min(255, b + amt);
    return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amt) {
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    r = Math.max(0, r - amt);
    g = Math.max(0, g - amt);
    b = Math.max(0, b - amt);
    return `rgb(${r},${g},${b})`;
}

// Update positions
function update(dt) {
    const speed = speedFactor * dt;

    for (const b of bodies) {
        if (b.parent) {
            b.moonAngle += b.moonOrbitSpeed * speed;
            const parentPos = b.parent.pos;
            const inc = b.inclination || 0;
            b.pos.x = parentPos.x + Math.cos(b.moonAngle) * b.moonOrbitRadius;
            b.pos.y = parentPos.y + Math.sin(b.moonAngle) * b.moonOrbitRadius * Math.sin(inc);
            b.pos.z = parentPos.z + Math.sin(b.moonAngle) * b.moonOrbitRadius * Math.cos(inc);
        } else if (b.orbitRadius > 0) {
            b.angle += b.orbitSpeed * speed;
            const inc = b.inclination || 0;
            b.pos.x = Math.cos(b.angle) * b.orbitRadius;
            b.pos.y = Math.sin(b.angle) * b.orbitRadius * Math.sin(inc);
            b.pos.z = Math.sin(b.angle) * b.orbitRadius * Math.cos(inc);
        }
    }
}

// Mouse controls
let dragging = false;
let lastMX, lastMY;

canvas.addEventListener('mousedown', e => {
    dragging = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
});
addEventListener('mousemove', e => {
    if (dragging) {
        const dx = e.clientX - lastMX;
        const dy = e.clientY - lastMY;
        camY += dx * 0.005;
        camX += dy * 0.005;
        camX = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, camX));
        lastMX = e.clientX;
        lastMY = e.clientY;
    }
    // Tooltip
    let found = null;
    for (const b of bodies) {
        if (!b.screenPos) continue;
        const dx = e.clientX - b.screenPos.x;
        const dy = e.clientY - b.screenPos.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < Math.max(b.scale + 5, 10)) {
            found = b;
            break;
        }
    }
    if (found) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY - 10) + 'px';
        let info = found.name;
        if (found.type === 'star') info += ' — G2V Star';
        else if (found.type === 'planet') info += ' — Planet';
        else info += ' — Moon of ' + found.parent.name;
        tooltip.textContent = info;
    } else {
        tooltip.style.display = 'none';
    }
});
addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camDist += e.deltaY * 0.5;
    camDist = Math.max(100, Math.min(3000, camDist));
}, { passive: false });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        dragging = true;
        lastMX = e.touches[0].clientX;
        lastMY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging) {
        const dx = e.touches[0].clientX - lastMX;
        const dy = e.touches[0].clientY - lastMY;
        camY += dx * 0.005;
        camX += dy * 0.005;
        camX = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, camX));
        lastMX = e.touches[0].clientX;
        lastMY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        camDist -= (dist - lastTouchDist) * 2;
        camDist = Math.max(100, Math.min(3000, camDist));
        lastTouchDist = dist;
    }
}, { passive: true });
canvas.addEventListener('touchend', () => dragging = false);

// UI bindings
document.getElementById('speed').addEventListener('input', e => {
    speedFactor = e.target.value / 100;
});
document.getElementById('zoom').addEventListener('input', e => {
    camDist = 1000 - (e.target.value / 100) * 900;
});
document.getElementById('showOrbits').addEventListener('change', e => {
    showOrbits = e.target.checked;
});
document.getElementById('showLabels').addEventListener('change', e => {
    showLabels = e.target.checked;
});
document.getElementById('resetBtn').addEventListener('click', () => {
    camX = 0.3;
    camY = 0;
    camDist = 800;
});

// Animation loop
let lastTime = 0;
function animate(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    update(dt);

    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) drawStar(s);

    // Draw orbits
    for (const b of bodies) {
        if (b.parent) {
            drawOrbit(b.parent.pos.x, b.parent.pos.y, b.parent.pos.z, b.moonOrbitRadius, b.inclination || 0);
        } else if (b.orbitRadius > 0) {
            drawOrbit(0, 0, 0, b.orbitRadius, b.inclination || 0);
        }
    }

    // Sort by depth (painter's algorithm)
    const renderList = [];
    for (const b of bodies) {
        b.pos = b.pos || { x: 0, y: 0, z: 0 };
        // Compute projected depth for sorting
        let r = rotateX(b.pos, camX);
        r = rotateY(r, camY);
        r.z += camDist;
        b.depth = r.z;
        renderList.push(b);
    }
    renderList.sort((a, b) => b.depth - a.depth);

    // Draw bodies (back to front)
    for (const b of renderList) {
        if (b.type === 'star') drawSun(b);
        else if (b.type === 'planet') drawPlanet(b);
        else drawMoon(b);
    }

    requestAnimationFrame(animate);
}

// Initial camera
camX = 0.4;
camY = 0;
requestAnimationFrame(animate);
</script>
</body>
</html>
