<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solar System — 3D Simulation (Qwen 3.8 PrismML Bonsai 2 PQ2)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: #dfe6f0; user-select: none; -webkit-user-select: none; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .panel { position: absolute; background: rgba(8,12,24,.75); border: 1px solid rgba(130,160,220,.28);
      border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
    #title { top: 14px; left: 14px; }
    #title h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .04em; }
    #title p { margin: 4px 0 0; font-size: 12px; color: #8f9bb2; }
    #title span { color: #ffd27a; }
    #info { top: 14px; right: 14px; min-width: 190px; }
    #info h2 { margin: 0 0 4px; font-size: 15px; color: #ffd27a; }
    #info p { margin: 2px 0; font-size: 12px; color: #c5cfe0; }
    #controls { left: 14px; bottom: 14px; pointer-events: auto; display: flex; flex-direction: column; gap: 7px; max-width: 320px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button { background: rgba(255,255,255,.08); border: 1px solid rgba(140,170,220,.35); color: #dfe6f0;
      border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit; }
    button:hover { background: rgba(255,255,255,.18); }
    button.active { background: #3d6fd8; border-color: #6ea0ff; }
    #hint { bottom: 16px; right: 14px; font-size: 11px; color: #8f9bb2; }
    #hint b { color: #c5cfe0; font-weight: 600; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="panel" id="title">
    <h1>☀ Solar System <span>3D</span></h1>
    <p id="simTime">sim time: 0.00 yr &nbsp;|&nbsp; vanilla JS, no libraries</p>
  </div>
  <div class="panel" id="info">
    <h2 id="infoName">Sun</h2>
    <p id="infoText">G-type main-sequence star · center of the system</p>
  </div>
  <div class="panel" id="controls">
    <div class="row">
      <button id="pauseBtn">⏸ Pause</button>
      <button class="speed" data-s="0.25">0.25×</button>
      <button class="speed active" data-s="1">1×</button>
      <button class="speed" data-s="2">2×</button>
      <button class="speed" data-s="10">10×</button>
    </div>
    <div class="row" id="focusRow"></div>
  </div>
  <div class="panel" id="hint"><b>drag</b> rotate · <b>scroll</b> zoom · <b>click</b> body</div>
</div>

<script>
  "use strict";
  const TAU = Math.PI * 2;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize); resize();

  /* ---------- helpers ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hex = c => "#" + (c >>> 0).toString(16).padStart(6, "0");
  const mixc = (a, b, t) => {
    a >>>= 0; b >>>= 0;
    const m = n => Math.round(((a >> n) & 255) * (1 - t) + ((b >> n) & 255) * t);
    return (m(16) << 16) | (m(8) << 8) | m(0);
  };

  /* ---------- static starfield ---------- */
  const stars = (() => {
    const s = [];
    for (let i = 0; i < 420; i++) {
      let x = Math.random() * 2 - 1, y = Math.random() * 2 - 1, z = Math.random() * 2 - 1;
      const l = Math.hypot(x, y, z) || 1;
      s.push({ x: x / l, y: y / l, z: z / l, a: Math.random() * .8 + .05, r: Math.random() * .7 + .3 });
    }
    return s;
  })();

  /* ---------- bodies ---------- */
  // distances & sizes are arbitrary "scene units"; periods are real relative values
  const planets = [
    { name: "Mercury", dist: 14,  size: .55,  period: 88,     inc: .05,  phase: .8,  color: 0xb3a99e,
      info: "0.39 AU · 88 d orbit" },
    { name: "Venus",   dist: 19,  size: .75,  period: 225,    inc: .01,  phase: 1.7, color: 0xe8c47f,
      info: "0.72 AU · 225 d orbit" },
    { name: "Earth",   dist: 25,  size: .85,  period: 365,    inc: 0,    phase: 2.9, color: 0x4f96d9,
      info: "1 AU · 1 yr orbit",
      moons: [ { name: "Moon", orbitR: 2.1,  period: 27.3, size: .45, inc: .09, phase: .5,  color: 0xc7c3b9 } ] },
    { name: "Mars",    dist: 31,  size: .6,   period: 687,    inc: .04,  phase: 4.2, color: 0xc1603a,
      info: "1.52 AU · 1.9 yr orbit" },
    { name: "Jupiter", dist: 44,  size: 2.5,  period: 4333,   inc: .01,  phase: .3,  color: 0xd9a873,
      info: "5.2 AU · 12 yr orbit",
      moons: [ { name: "Io",      orbitR: 3.0, period: 1.77, size: .4,  inc: 0,    phase: 0.0, color: 0xdcb47a },
        { name: "Europa",  orbitR: 3.7, period: 3.55, size: .45, inc: .02,  phase: 1.2, color: 0xd9d0bf },
        { name: "Ganymede",orbitR: 4.5, period: 7.15, size: .55, inc: .03,  phase: 2.1, color: 0xa8a08f },
        { name: "Callisto",orbitR: 5.3, period: 15.9, size: .5,  inc: .04,  phase: 3.0, color: 0x8d887b } ] },
    { name: "Saturn",  dist: 53,  size: 2.2,  period: 10759,  inc: .02,  phase: 1.1, color: 0xe8d3a2,
      info: "9.6 AU · 29 yr orbit", ringR: [3.3, 5.4],
      moons: [ { name: "Titan", orbitR: 4.0, period: 15.4, size: .55, inc: .05, phase: 1.9, color: 0xe0b580 } ] },
    { name: "Uranus",  dist: 63,  size: 1.4,  period: 30687,  inc: .01,  phase: 2.4, color: 0x8fd3df,
      info: "19.2 AU · 84 yr orbit" },
    { name: "Neptune", dist: 72,  size: 1.4,  period: 60190,  inc: .02,  phase: 3.4, color: 0x5b6ee9,
      info: "30 AU · 165 yr orbit" },
  ];
  const sun = { name: "Sun", size: 8.5, color: 0xffd27a,
    info: "G-type main-sequence star · center of the system", pos: [0, 0, 0] };

  // asteroid belt
  const belt = [];
  for (let i = 0; i < 300; i++)
    belt.push({ d: 35.5 + Math.random() * 4.5, a: Math.random() * TAU,
      sp: TAU / (1300 + Math.random() * 1400), r: Math.random() * .5 + .35, al: Math.random() * .4 + .15 });

  /* ---------- camera ---------- */
  const cam = { yaw: .6, pitch: .5, dist: 170, autoDist: 170, focus: null };
  const target = { x: 0, y: 0, z: 0 };
  let f = 1600; // focal length in px

  // world -> screen (perspective), returns null if behind camera
  function proj(px, py, pz, out) {
    const cy = Math.cos(cam.yaw),  sy = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    let x = px - target.x, y = py - target.y, z = pz - target.z;
    let y1 = y * cp - z * sp, z1 = y * sp + z * cp;        // pitch (around x)
    x = x * cy - z1 * sy;                                   // yaw   (around y)
    const zz = z1 * sy + x * cy + cam.dist;                 // depth from camera
    if (zz < 0.001) return null;
    out.sx = W / 2 + x * (f / zz);
    out.sy = H / 2 - y1 * (f / zz);
    out.z = zz;
    return out;
  }

  /* ---------- rendering ---------- */
  function drawStars() {
    const q = {};
    for (const s of stars) {
      const p = proj(s.x * 4500, s.y * 4500, s.z * 4500, q);
      if (!p) continue;
      ctx.globalAlpha = s.a * .8;
      ctx.fillStyle = "#cfe0ff";
      const r = s.r * (4500 / p.z) * 0.05 + s.r * .5;
      ctx.fillRect(p.sx - r, p.sy - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function orbitCircle(d, inc, alpha) {
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const a = i / 80 * TAU;
      const p = proj(d * Math.cos(a), d * Math.sin(a) * inc, d * Math.sin(a) * Math.cos(inc), q);
      if (!p) { ctx.stroke(); return; }
      i === 0 ? ctx.moveTo(p.sx, p.sy) : ctx.lineTo(p.sx, p.sy);
    }
    ctx.stroke();
  }
  const q = { sx: 0, sy: 0, z: 0 };

  function drawBelt() {
    ctx.fillStyle = "#a89f90";
    for (const b of belt) {
      const a = b.a + b.sp * simDay;
      const p = proj(b.d * Math.cos(a), 0, b.d * Math.sin(a), q);
      if (!p) continue;
      const r = b.r * (f / p.z) * .7;
      ctx.globalAlpha = b.al;
      ctx.fillRect(p.sx - r, p.sy - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSunGlow(sx, sy, r) {
    const R = r * 5.5;
    const g = ctx.createRadialGradient(sx, sy, r * .2, sx, sy, R);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.12, "#fff3c8");
    g.addColorStop(.35, "rgba(255,190,90,0.35)");
    g.addColorStop(1, "rgba(255,150,50,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
  }

  function drawSphere(x, y, r, c, l) {
    if (r < 0.5) {
      ctx.fillStyle = "#e8e8e8";
      ctx.beginPath(); ctx.arc(x, y, Math.max(r, .5), 0, TAU); ctx.fill();
      return;
    }
    const gx = x + r * .34 * l.x, gy = y + r * .34 * l.y;
    const g = ctx.createRadialGradient(gx, gy, r * .12, x, y, r);
    g.addColorStop(0, hex(mixc(c, 0xffffff, .45)));
    g.addColorStop(.55, hex(c));
    g.addColorStop(1, hex(mixc(c, 0x000000, .58)));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  function drawBands(x, y, r, c) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
    ctx.fillStyle = "rgba(64,40,20,.25)";
    ctx.fillRect(x - r, y - r * .48, r * 2, r * .12);
    ctx.fillStyle = "rgba(255,240,210,.18)";
    ctx.fillRect(x - r, y - r * .10, r * 2, r * .09);
    ctx.fillStyle = "rgba(64,40,20,.20)";
    ctx.fillRect(x - r, y + r * .28, r * 2, r * .14);
    ctx.restore();
  }

  function drawSaturnRings(it, front) {
    const [ri, ro] = it.ref.ringR;
    const out = [], inn = [], qo = {}, qi = {};
    for (let i = 0; i < 90; i++) {
      const a = i / 90 * TAU;
      if (proj(it.ref.pos[0] + Math.cos(a) * ri, it.ref.pos[1], it.ref.pos[2] + Math.sin(a) * ri, qo))
        inn.push({ ...qo, back: it.z > qo.z });
      if (proj(it.ref.pos[0] + Math.cos(a) * ro, it.ref.pos[1], it.ref.pos[2] + Math.sin(a) * ro, qo))
        out.push({ ...qo, back: it.z > qo.z });
    }
    // split into two contiguous arcs along the planet's depth plane
    const arcs = (arr) => {
      const res = [];
      for (let i = 0; i < arr.length; i++)
        i === 0 ? res.push([i, i]) : (arr[i].back !== arr[i - 1].back
                ? (res[res.length - 1][1] = i - 1, res.push([i, i]))
                : res[res.length - 1][1] = i);
      return res;
    };
    const ai = arcs(inn), ao = arcs(out);
    for (let k = 0; k < 2; k++) {
      const [i0, i1] = ao[k], in0 = ai[k];
      if (!ao[k]) continue;
      const frontArc = out[i0].back === front;
      if (frontArc) continue;
      ctx.beginPath();
      ctx.moveTo(out[i0].sx, out[i0].sy);
      for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(out[i].sx, out[i].sy);
      for (let i = in0 + i1 - i0; i >= in0; i--) ctx.lineTo(inn[i].sx, inn[i].sy);
      ctx.closePath();
      const g = ctx.createLinearGradient(it.sx - ro * f / it.z, it.sy, it.sx + ro * f / it.z, it.sy);
      g.addColorStop(0, "rgba(180,160,120,.50)");
      g.addColorStop(.5, "rgba(225,205,165,.65)");
      g.addColorStop(1, "rgba(180,160,120,.50)");
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  function label(x, y, name) {
    ctx.font = "11px system-ui, sans-serif";
    ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 2.5;
    ctx.strokeText(name, x + 5, y);
    ctx.fillStyle = "#c8d3e4";
    ctx.fillText(name, x + 5, y);
  }

  /* ---------- main loop ---------- */
  let simDay = 0, baseDays = 12, last = performance.now(), paused = false;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    if (!paused) simDay += baseDays * dt;
    f = Math.min(W, H) * 2.0;

    // update positions (orbit angle = phase + 2π·simDay/period)
    planets.forEach(p => {
      const a = p.phase + TAU * simDay / p.period;
      p.pos = [p.dist * Math.cos(a), p.dist * Math.sin(a) * p.inc, p.dist * Math.sin(a) * Math.cos(p.inc)];
      for (const m of (p.moons || [])) {
        const am = m.phase + TAU * simDay / m.period;
        m.pos = [p.pos[0] + m.orbitR * Math.cos(am),
          p.pos[1] + m.orbitR * Math.sin(am) * m.inc,
          p.pos[2] + m.orbitR * Math.sin(am) * Math.cos(m.inc)];
      }
    });

    // camera target follows the focused body
    const t = cam.focus ? cam.focus.pos : sun.pos;
    target.x = t[0]; target.y = t[1]; target.z = t[2];

    ctx.clearRect(0, 0, W, H);
    drawStars();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(140,160,200,.10)";
    for (const p of planets) orbitCircle(p.dist, p.inc);
    drawBelt();

    // project all bodies; sort far -> near so nearer ones occlude
    const items = [];
    const bodyOut = {};
    const projBody = ref => {
      const p = proj(ref.pos[0], ref.pos[1], ref.pos[2], bodyOut);
      if (!p) return null;
      return { ref, sx: p.sx, sy: p.sy, r: ref.size * (f / p.z), z: p.z };
    };
    items.push(projBody(sun), ...planets.map(projBody),
            ...planets.flatMap(p => (p.moons || []).map(projBody)).filter(Boolean))            ;
    items.sort((a, b) => b.z - a.z);

    const sunP = items.find(i => i.ref === sun);
    if (sunP) {
      drawSunGlow(sunP.sx, sunP.sy, sunP.r);
    }
    // light direction = direction toward the Sun, in screen space
    const light = (it) => {
      if (!sunP) return { x: .6, y: -.6 };
      const dx = sunP.sx - it.sx, dy = sunP.sy - it.sy;
      const l = Math.hypot(dx, dy) || 1;
      return { x: dx / l, y: dy / l };
    };

    for (const it of items) {
      if (it.ref.ringR) drawSaturnRings(it, false);  // back half of ring
      drawSphere(it.sx, it.sy, it.r, it.ref.color, light(it));
      if (it.r > 3) {
        if (it.ref.name === "Jupiter" || it.ref.name === "Saturn") drawBands(it.sx, it.sy, it.r, it.ref.color);
        if (it.ref.name === "Earth" && it.r > 6) {
          ctx.save(); ctx.beginPath(); ctx.arc(it.sx, it.sy, it.r, 0, TAU); ctx.clip();
          ctx.fillStyle = "rgba(120,200,130,.35)";
          ctx.fillRect(it.sx - it.r * .8, it.sy - it.r * .25, it.r * .55, it.r * .16);
          ctx.fillRect(it.sx + it.r * .15, it.sy + it.r * .1, it.r * .5, it.r * .12);
          ctx.restore();
        }
      }
      if (it.ref.ringR) drawSaturnRings(it, true);   // front half of ring (in front of disc)
    }

    // labels
    for (const it of items) {
      if (it.ref.moons && it.r > 1.6) label(it.sx, it.sy - it.r - 8, it.ref.name);
      if (it.ref.name === "Sun") label(it.sx, it.sy - it.r - 6, "Sun");
      if (!it.ref.moons || it.r > 1.5) { /* moon labels below */ }
    }
    for (const it of items) {
      if (it.ref.moons && it.r > 2.2) label(it.sx, it.sy - it.r - 6, it.ref.name);
    }

    // selection halo
    if (cam.focus) {
      const it = items.find(i => i.ref === cam.focus);
      if (it) {
        ctx.strokeStyle = "rgba(255,210,122,.85)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(it.sx, it.sy, it.r + 6, 0, TAU); ctx.stroke();
      }
    }

    document.getElementById("simTime").textContent =
            "sim time: " + (simDay / 365.25).toFixed(2) + " yr  |  vanilla JS, no libraries";
  }
  requestAnimationFrame(frame);

  /* ---------- HUD ---------- */
  function updateInfo() {
    const b = cam.focus || sun;
    document.getElementById("infoName").textContent = b.name;
    document.getElementById("infoText").textContent = b.info;
  }

  const pauseBtn = document.getElementById("pauseBtn");
  pauseBtn.onclick = () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶ Play" : "⏸ Pause";
  };
  document.querySelectorAll(".speed").forEach(b => {
    b.onclick = () => {
      baseDays = 12 * parseFloat(b.dataset.s);
      document.querySelectorAll(".speed").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    };
  });

  function setFocus(ref) {
    cam.focus = ref === sun ? null : ref;
    cam.dist = cam.autoDist = clamp(ref === sun ? 170 : 1600 / (ref.size * 10), 30, 320);
    updateInfo();
  }
  const focusRow = document.getElementById("focusRow");
  [...planets].sort((a, b) => a.name.localeCompare(b.name)).concat(sun).forEach(b => {
    const btn = document.createElement("button");
    btn.textContent = b.name;
    btn.onclick = () => setFocus(b);
    focusRow.appendChild(btn);
  });
  // add reset button
  const rb = document.createElement("button");
  rb.id = "resetBtn"; rb.className = "row"; rb.style.width = "100%";
  rb.textContent = "↺ Reset view (center on Sun)";
  document.getElementById("controls").appendChild(rb);
  document.getElementById("resetBtn").onclick = () => {
    setFocus(sun); cam.yaw = .6; cam.pitch = .5;
  };

  updateInfo();

  /* ---------- interaction ---------- */
  let dragging = false, lx = 0, ly = 0, moved = 0;
  const pickable = []; // {sx, sy, r, ref} rebuilt each frame for picking

  canvas.addEventListener("mousedown", e => {
    dragging = true; lx = e.clientX; ly = e.clientY; moved = 0;
    canvas.classList.add("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    moved += Math.hypot(dx, dy);
    cam.yaw += dx * .0025;
    cam.pitch = clamp(cam.pitch + dy * .0025, -1.3, 1.3);
  });
  window.addEventListener("mouseup", e => {
    if (!dragging) return;
    dragging = false; canvas.classList.remove("dragging");
    if (moved < 6) {
      let best = null, bd = 1e9;
      for (const p of pickable) {
        const d = Math.hypot(p.sx - e.clientX, p.sy - e.clientY);
        if (d < bd && d < Math.max(12, p.r + 6)) { bd = d; best = p; }
      }
      if (best) setFocus(best.ref);
    }
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    cam.autoDist = clamp(cam.autoDist * Math.exp(-e.deltaY * .0008), 25, 320);
    cam.dist = cam.autoDist;
  }, { passive: false });

  // touch support
  let touch = null;
  canvas.addEventListener("touchstart", e => {
    if (e.touches.length > 1) return;
    const p = e.touches[0];
    touch = { x: p.clientX, y: p.clientY }; moved = 0;
    canvas.classList.add("dragging");
  }, { passive: false });
  canvas.addEventListener("touchmove", e => {
    if (e.touches.length > 1 || !touch) return;
    e.preventDefault();
    const p = e.touches[0];
    const dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    touch.x = p.clientX; touch.y = p.clientY;
    moved += Math.hypot(dx, dy);
    cam.yaw += dx * .0025;
    cam.pitch = clamp(cam.pitch + dy * .0025, -1.3, 1.3);
  }, { passive: false });
  canvas.addEventListener("touchend", e => {
    if (!touch) return;
    touch = null; canvas.classList.remove("dragging");
    if (moved < 6 && e.changedTouches.length) {
      const p = e.changedTouches[0];
      let best = null, bd = 1e9;
      for (const q2 of pickable) {
        const d = Math.hypot(q2.sx - p.clientX, q2.sy - p.clientY);
        if (d < bd && d < Math.max(12, q2.r + 6)) { bd = d; best = q2; }
      }
      if (best) setFocus(best.ref);
    }
  });
</script>
</body>
</html>
