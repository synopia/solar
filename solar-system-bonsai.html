<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — 3D Simulation (PrismML Bonsai 2)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#040610;font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #ui{position:fixed;top:12px;left:12px;background:rgba(8,12,26,.78);border:1px solid rgba(120,160,255,.25);border-radius:10px;padding:12px 14px;color:#cfd8ff;font-size:12.5px;width:215px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #ui h1{margin:0 0 8px;font-size:15px;color:#fff;letter-spacing:.5px;font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;gap:8px}
  label{cursor:pointer}
  input[type=range]{accent-color:#6aa5ff;width:92px}
  input[type=checkbox]{accent-color:#6aa5ff;width:14px}
  .days{color:#ffd97a;font-variant-numeric:tabular-nums}
  button{background:rgba(90,150,255,.18);border:1px solid rgba(90,150,255,.4);color:#cfe0ff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;width:100%;margin-top:4px}
  button:hover{background:rgba(90,150,255,.35)}
  #info{position:fixed;left:12px;bottom:12px;background:rgba(8,12,26,.78);border:1px solid rgba(120,160,255,.25);border-radius:10px;padding:10px 14px;color:#cfd8ff;font-size:12.5px;width:250px;line-height:1.45;backdrop-filter:blur(6px);display:none}
  #info h2{margin:0 0 4px;font-size:14px;color:#ffd97a}
  #hint{position:fixed;top:12px;right:14px;color:rgba(160,180,230,.6);font-size:11.5px;line-height:1.6;text-align:right;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>☉ SOLAR SYSTEM</h1>
  <div class="row"><label>Speed</label><input type="range" id="speed" min="0" max="100" value="25"></div>
  <div class="row"><label>Time</label><span class="days" id="days">Day 0</span></div>
  <div class="row"><label><input type="checkbox" id="orbits" checked> Orbit paths</label></div>
  <div class="row"><label><input type="checkbox" id="mlabels" checked> Moon orbits</label></div>
  <div class="row"><label><input type="checkbox" id="labels" checked> Labels</label></div>
  <button id="pause">⏸ Pause</button>
  <button id="reset">↺ Reset view</button>
</div>
<div id="info"></div>
<div id="hint">drag — orbit camera<br>scroll — zoom<br>click — info</div>

<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

/* ---------- camera: orbit around origin, perspective projection ---------- */
const CAM={yaw:0.55,pitch:0.45,dist:1200,f:720},CAM_DEF={...CAM};
function project(x,y,z){
  const cY=Math.cos(CAM.yaw),sY=Math.sin(CAM.yaw);
  const cP=Math.cos(CAM.pitch),sP=Math.sin(CAM.pitch);
  const x1=x*cY+z*sY,  z1=-x*sY+z*cY;
  const x2=x1*cP-z1*sP, z2=x1*sP+z1*cP;
  const depth=CAM.dist-z2;
  if(depth<1)return null;
  const s=CAM.f/depth;
  return {x:W/2+x2*s,y:H/2-y*s,depth,s};
}

/* ---------- data (display-tuned radii/sizes, not to scale) ---------- */
const P=[
 {n:'Mercury',col:'#b3a99c',sz:2.6,r:38,T:88,inc:0.05,moons:[],
  info:'Smallest planet. One year = 88 Earth days. No moons.'},
 {n:'Venus',col:'#e9c47d',sz:4.9,r:60,T:225,inc:0.03,moons:[],
  info:'Hottest planet (465 °C) from a runaway greenhouse effect. Spins backwards.'},
 {n:'Earth',col:'#6fb6d9',sz:5.2,r:84,T:365,inc:0.04,moons:[
  {n:'Moon',col:'#c9c8c2',sz:2.0,r:11,T:27.3}],
  info:'Only known world with life. ~71% water. Its large moon drives the tides.'},
 {n:'Mars',col:'#c0613c',sz:4.0,r:112,T:687,inc:0.08,moons:[
  {n:'Phobos',col:'#9a8a7c',sz:1.1,r:4,T:0.32},{n:'Deimos',col:'#8a7d72',sz:0.9,r:5.5,T:0.77}],
  info:'The Red Planet. Home to the tallest volcano (Olympus Mons) in the solar system.'},
 {n:'Jupiter',col:'#e3b97f',sz:13,r:178,T:4333,inc:0.02,moons:[
  {n:'Io',col:'#d9b272',sz:2.1,r:6,T:1.77},{n:'Europa',col:'#e8e0cc',sz:1.9,r:8.5,T:3.55},
  {n:'Ganymede',col:'#b19c7f',sz:2.7,r:11.5,T:7.15},{n:'Callisto',col:'#6e6a63',sz:2.4,r:15,T:16.7}],
  info:'The Great Red Spot is a storm bigger than Earth, raging for centuries.'},
 {n:'Saturn',col:'#e8d5a3',sz:11,r:238,T:10759,inc:0.03,rings:19,ringTilt:0.5,moons:[
  {n:'Titan',col:'#d9a46b',sz:3.0,r:13,T:15.4},{n:'Rhea',col:'#d3cbc2',sz:2.3,r:16.5,T:4.54},
  {n:'Enceladus',col:'#f0ebe4',sz:1.8,r:20,T:1.37}],
  info:'Its rings are mostly water ice. Titan has lakes of liquid methane. Less dense than water.'},
 {n:'Uranus',col:'#8fd3d6',sz:7.2,r:290,T:30689,inc:0.01,rings:13.5,ringTilt:1.68,moons:[
  {n:'Titania',col:'#d8cfc4',sz:1.7,r:9,T:4.45}],
  info:'Ice giant rolling on its side (98° tilt). Winds reach 900 km/h.'},
 {n:'Neptune',col:'#5d7fd1',sz:7.0,r:335,T:16480,inc:0.01,moons:[
  {n:'Triton',col:'#aacbe2',sz:2.3,r:10,T:5.88}],
  info:'Windiest planet (2,100 km/h). Triton orbits backwards — likely a captured Kuiper Belt object.'},
];
const SUN={sz:26,glow:60};

/* ---------- starfield ---------- */
const STARS=Array.from({length:420},()=>{
  const r=(a,b)=>a+Math.random()*(b-a);
  return {x:r(0,1),y:r(0,1),rr:r(0.5,1.4),tw:r(1,2.5),ph:r(0,6.28),a:r(0.25,0.9)};
});
/* random orbit phases so bodies start spread out */
for(const p of P){p.ph=Math.random()*Math.PI*2;for(const m of p.moons||[])m.ph=Math.random()*Math.PI*2;}

/* ---------- state & UI ---------- */
let tDays=0,lastT=performance.now(),paused=false,selected=null,speed=0.25;
let hitBodies=[];
const show={orbits:true,mlabels:true,labels:true};
document.getElementById('speed').oninput=e=>{speed=e.target.value/100};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Play':'⏸ Pause'};
document.getElementById('reset').onclick=()=>Object.assign(CAM,CAM_DEF);
document.getElementById('orbits').onchange=e=>show.orbits=e.target.checked;
document.getElementById('mlabels').onchange=e=>show.mlabels=e.target.checked;
document.getElementById('labels').onchange=e=>show.labels=e.target.checked;

/* ---------- interaction ---------- */
let dragging=false,lastX=0,lastY=0,downX=0,downY=0;
function bind(el){
  el.addEventListener('pointerdown',e=>{dragging=true;lastX=downX=e.clientX;lastY=downY=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{
    if(!dragging)return;
    CAM.yaw+=(e.clientX-lastX)*0.004;
    CAM.pitch=Math.max(-1.4,Math.min(1.4,CAM.pitch+(e.clientY-lastY)*0.004));
    lastX=e.clientX;lastY=e.clientY;
  });
  el.addEventListener('pointerup',e=>{
    dragging=false;
    if(Math.hypot(e.clientX-downX,e.clientY-downY)<6)trySelect(e.clientX,e.clientY);
  });
}
bind(canvas);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  CAM.dist=Math.max(300,Math.min(5000,CAM.dist*(e.deltaY>0?1.09:1/1.09)));
},{passive:false});

function trySelect(px,py){
  let best=null,bd=Infinity;
  for(const b of hitBodies){
    const d=Math.hypot(b.sx-px,b.sy-py);
    if(d<b.rpx+7&&d<bd){bd=d;best=b;}
  }
  selected=best;
  const info=document.getElementById('info');
  if(selected){
    info.style.display='block';
    const txt=selected.kind==='moon'?'A moon of '+selected.parent.n+': '+selected.def.info:(selected.def.info||'');
    info.innerHTML='<h2>'+selected.name+'</h2>'+txt;
  }else info.style.display='none';
}

/* ---------- color helpers ---------- */
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,w)=>'rgb('+(a[0]+(b[0]-a[0])*w|0)+','+(a[1]+(b[1]-a[1])*w|0)+','+(a[2]+(b[2]-a[2])*w|0)+')';
const WHT=[255,255,255],BLK=[20,16,10];
const shades=c=>{const k=hex2rgb(c);return{hi:mix(k,WHT,.55),mid:k,lo:mix(k,BLK,.55)}};

/* ---------- draw helpers ---------- */
function drawSun(s){
  const rad=SUN.sz*s.s;
  const g=ctx.createRadialGradient(s.x,s.y,rad*.5,s.x,s.y,SUN.glow*s.s);
  g.addColorStop(0,'rgba(255,230,150,.85)');g.addColorStop(.25,'rgba(255,180,60,.22)');g.addColorStop(1,'rgba(255,140,30,0)');
  ctx.fillStyle=g;
  ctx.fillRect(s.x-SUN.glow*s.s-10,s.y-SUN.glow*s.s-10,2*SUN.glow*s.s+20,2*SUN.glow*s.s+20);
  const b=ctx.createRadialGradient(s.x-rad*.2,s.y-rad*.2,rad*.05,s.x,s.y,rad);
  b.addColorStop(0,'#ffffff');b.addColorStop(.55,'#fff0a0');b.addColorStop(1,'#ffb13c');
  ctx.fillStyle=b;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,Math.PI*2);ctx.fill();
}
function drawSphere(b){
  const rad=b.def.sz*b.s.s,sc=shades(b.def.col);
  let lx=b.sunX-b.sx,ly=b.sunY-b.sy;
  const L=Math.hypot(lx,ly)||1;lx/=L;ly/=L;
  const g=ctx.createRadialGradient(b.sx+lx*rad*.5,b.sy+ly*rad*.5,rad*.06,b.sx,b.sy,rad);
  g.addColorStop(0,sc.hi);g.addColorStop(.5,sc.mid);g.addColorStop(1,sc.lo);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.sx,b.sy,rad,0,Math.PI*2);ctx.fill();
}
/* Ring = tilted 3D circle. Split into back/front arcs so the planet correctly occludes it. */
function drawRingsHalf(b,drawBack){
  const tilt=b.def.ringTilt,R=b.def.rings,n=160;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const w=project(b.wx+R*Math.cos(a),
                    b.wy+R*Math.sin(a)*Math.sin(tilt),
                    b.wz+R*Math.sin(a)*Math.cos(tilt));
    pts.push({p:w,back:w?w.depth>=b.s.depth:false});
  }
  for(let i=0;i<n;i++){
    if(pts[i].back!==drawBack||!pts[i].p)continue;
    const arr=[];let j=i;
    while(j<n&&pts[j].back===drawBack&&pts[j].p){arr.push(pts[j].p);j++;}
    if(arr.length<3)continue;
    ctx.beginPath();ctx.moveTo(arr[0].x,arr[0].y);
    for(let k=1;k<arr.length;k++)ctx.lineTo(arr[k].x,arr[k].y);
    ctx.strokeStyle='rgba(225,210,160,.5)';
    ctx.lineWidth=Math.max(.6,1.5*b.s.s);
    ctx.stroke();
  }
}
function drawOrbit(r,inc){
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=120;i++){
    const a=i/120*Math.PI*2;
    const p=project(r*Math.cos(a),r*Math.sin(a)*inc,r*Math.sin(a));
    if(!p){first=true;continue;}
    if(first){ctx.moveTo(p.x,p.y);first=false;}else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle='rgba(120,160,255,.2)';ctx.lineWidth=1;ctx.stroke();
}
function drawMoonOrbit(w,m){
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=90;i++){
    const a=i/90*Math.PI*2;
    const p=project(w.x+m.r*Math.cos(a),w.y+m.r*Math.sin(a)*.4,w.z+m.r*Math.sin(a));
    if(!p){first=true;continue;}
    if(first){ctx.moveTo(p.x,p.y);first=false;}else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle='rgba(160,180,220,.18)';ctx.lineWidth=1;ctx.stroke();
}

/* ---------- main loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-lastT)/1000,0.1);lastT=now;
  if(!paused)tDays+=dt*speed*12;   /* 12 Earth-days per real second at 1.0x */
  const T=now/1000;

  ctx.fillStyle='#040610';ctx.fillRect(0,0,W,H);
  for(const st of STARS){
    ctx.globalAlpha=st.a*(0.6+0.4*Math.sin(T*st.tw+st.ph));
    ctx.fillStyle='#cfe0ff';
    ctx.fillRect(st.x*W,st.y*H,st.rr,st.rr);
  }
  ctx.globalAlpha=1;

  const sunS=project(0,0,0);
  if(sunS)drawSun(sunS);
  if(show.orbits)for(const p of P)drawOrbit(p.r,p.inc);

  /* build body list (planets + moons) */
  hitBodies=[];
  const bodies=[];
  for(const p of P){
    const a=Math.PI*2*tDays/p.T+p.ph;
    const wx=p.r*Math.cos(a),wy=p.r*Math.sin(a)*p.inc,wz=p.r*Math.sin(a);
    const s=project(wx,wy,wz);if(!s)continue;
    const b={kind:'planet',def:p,parent:null,wx,wy,wz,s,rpx:p.sz*s.s,sx:s.x,sy:s.y,sunX:sunS.x,sunY:sunS.y};
    bodies.push(b);hitBodies.push(b);
    for(const m of p.moons||[]){
      const ma=Math.PI*2*(tDays+m.ph)/m.T;
      const mx=wx+m.r*Math.cos(ma),my=wy+m.r*Math.sin(ma)*.4,mz=wz+m.r*Math.sin(ma);
      const ms=project(mx,my,mz);if(!ms)continue;
      const mb={kind:'moon',def:m,parent:p,wx:mx,wy:my,wz:mz,s:ms,
        rpx:m.sz*ms.s,sx:ms.x,sy:ms.y,sunX:sunS.x,sunY:sunS.y};
      bodies.push(mb);hitBodies.push(mb);
      if(show.mlabels)drawMoonOrbit({x:wx,y:wy,z:wz},m);
    }
  }
  bodies.sort((a,b)=>b.s.depth-a.s.depth);   /* painter's algorithm: far → near */

  for(const b of bodies){
    if(b.def.rings)drawRingsHalf(b,true);     /* back half behind planet */
    drawSphere(b);
    if(b.def.rings)drawRingsHalf(b,false);    /* front half in front */
    if(show.labels){
      const showLabel=b.kind!=='moon'||b.rpx>1.2;
      if(showLabel){
        ctx.fillStyle='#b8c8ff';ctx.font='10px sans-serif';ctx.textAlign='center';
        ctx.fillText(b.def.n,b.sx,b.sy-b.rpx-5);
      }
    }
    if(b===selected){
      ctx.strokeStyle='#ffd97a';ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.arc(b.sx,b.sy,b.rpx+6,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  document.getElementById('days').textContent='Day '+Math.floor(tDays);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
